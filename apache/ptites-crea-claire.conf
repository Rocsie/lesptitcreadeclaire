# VirtualHost Apache2 pour "Les P'tites Créa de Claire"
# Emplacement sur le VPS : /etc/apache2/sites-available/ptites-crea-claire.conf
#
# Ce fichier ne concerne que ce site : aucun autre VirtualHost n'est modifié.
# Next.js écoute en local sur le port 3015 (voir ecosystem.config.js).
#
# Il ne contient volontairement que la partie HTTP. Le certificat et le VirtualHost HTTPS
# sont créés par Certbot, qui recopie cette configuration et ajoute la redirection :
#   sudo certbot --apache -d lesptitescreadeclaire.com -d www.lesptitescreadeclaire.com
# (Un bloc <VirtualHost *:443> avec "SSLEngine on" mais sans certificat ferait échouer
#  "apache2ctl configtest" et bloquerait le rechargement d'Apache pour tous les sites.)

<VirtualHost *:80>
    ServerName lesptitescreadeclaire.com
    ServerAlias www.lesptitescreadeclaire.com
    ServerAdmin contact@lesptitescreadeclaire.com

    # Photos de bijoux : 12 photos de 10 Mo au plus par envoi
    LimitRequestBody 125829120

    ProxyPreserveHost On
    ProxyRequests Off

    # Indique à Next.js si la visite arrive en HTTPS (cookie de session "Secure").
    # Certbot recopie ce bloc dans le VirtualHost HTTPS, où REQUEST_SCHEME vaut "https".
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

    ProxyPass / http://127.0.0.1:3015/
    ProxyPassReverse / http://127.0.0.1:3015/

    ErrorLog ${APACHE_LOG_DIR}/ptites-crea-claire-error.log
    CustomLog ${APACHE_LOG_DIR}/ptites-crea-claire-access.log combined
</VirtualHost>
