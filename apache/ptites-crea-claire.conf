# Configuration Apache2 VirtualHost pour "Les P'tites Créa de Claire"
# Emplacement sur le VPS : /etc/apache2/sites-available/ptites-crea-claire.conf
#
# IMPORTANT : Ce fichier est dédié uniquement à ce site et n'affecte aucun autre VirtualHost existant.
# Port interne Next.js : 3015

<VirtualHost *:80>
    ServerName lesptitescreadeclaire.fr
    ServerAlias www.lesptitescreadeclaire.fr

    ServerAdmin contact@lesptitescreadeclaire.fr

    # Redirection automatique vers HTTPS une fois le certificat SSL Let's Encrypt actif
    # (Certbot configure automatiquement cela, mais voici la règle propre)
    RewriteEngine On
    RewriteCond %{HTTPS} !=on
    RewriteRule ^/?(.*) https://%{SERVER_NAME}/$1 [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/ptites-crea-claire-error.log
    CustomLog ${APACHE_LOG_DIR}/ptites-crea-claire-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName lesptitescreadeclaire.fr
    ServerAlias www.lesptitescreadeclaire.fr

    ServerAdmin contact@lesptitescreadeclaire.fr

    # Limite de taille d'upload adaptée pour les photos de bijoux (20 Mo max)
    LimitRequestBody 20971520

    # Modules SSL (ajustés automatiquement par Certbot)
    SSLEngine on
    # SSLCertificateFile /etc/letsencrypt/live/lesptitescreadeclaire.fr/fullchain.pem
    # SSLCertificateKeyFile /etc/letsencrypt/live/lesptitescreadeclaire.fr/privkey.pem

    # Transmission des en-têtes client réels à Next.js
    ProxyPreserveHost On
    ProxyRequests Off

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # Support WebSockets / Next.js HMR si nécessaire
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) "ws://127.0.0.1:3015/$1" [P,L]

    # Reverse Proxy vers l'instance Next.js dédiée sur le port local 3015
    ProxyPass / http://127.0.0.1:3015/
    ProxyPassReverse / http://127.0.0.1:3015/

    # Compression et sécurité
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-XSS-Protection "1; mode=block"
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/ptites-crea-claire-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/ptites-crea-claire-ssl-access.log combined
</VirtualHost>
